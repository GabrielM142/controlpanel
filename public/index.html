<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SIDE — Diseño para Power BI (v2 — nomenclatura definitiva)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#161B33; --pbi-yellow:#F2C811;
  --ink:#252423; --muted:#605E5C; --line:#E1DFDD;
  --bg:#F3F2F1; --card:#FFFFFF;
  --gold:#AB8752;
  --green:#107C41; --green-bg:#DFF6DD;
  --amber:#C19C00; --amber-bg:#FFF4CE;
  --red:#D13438; --red-bg:#FDE7E9;
  --blue:#0078D4;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
.app{display:flex;min-height:100vh;}
.nav{width:230px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column;}
.nav-head{padding:16px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08);}
.nav-head .badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;background:rgba(242,200,17,.15);color:var(--pbi-yellow);padding:3px 8px;border-radius:3px;font-weight:600;letter-spacing:.03em;}
.nav-head .title{font-weight:700;font-size:15.5px;margin-top:9px;}
.nav-head .sub{font-size:11px;color:#9AA0B4;margin-top:2px;}
.nav-scroll{flex:1;overflow-y:auto;padding:10px 0 20px;}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#8891A8;font-weight:600;padding:14px 16px 6px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 16px;font-size:12.3px;color:#C7CCDC;cursor:pointer;border-left:3px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
.nav-item.active{background:rgba(242,200,17,.12);color:#fff;border-left-color:var(--pbi-yellow);font-weight:600;}
.nav-item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;}
.topbar h1{font-size:19px;margin:0;font-weight:700;}
.topbar .crumb{font-size:11px;color:var(--muted);margin-bottom:3px;}
.pageQuestion{font-size:12px;color:var(--blue);font-style:italic;margin-top:3px;}
.nav-item.paused{opacity:.55;}
.nav-item .pausetag{font-size:8px;background:rgba(255,255,255,.12);padding:1px 5px;border-radius:8px;margin-left:auto;text-transform:uppercase;letter-spacing:.03em;}
.pause-box{background:#FAF9F8;border:1px dashed var(--line);border-radius:4px;padding:30px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;}
.ai-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;background:linear-gradient(90deg,#EAE6FB,#DCEEFB);color:#5B3FBF;padding:3px 9px;border-radius:12px;font-weight:700;letter-spacing:.02em;}
.ai-box{background:linear-gradient(180deg,#FBFAFF 0%,#FFFFFF 100%);border:1px solid #E3DEF7;border-radius:4px;}
.ai-narrative{font-size:12.5px;line-height:1.8;color:var(--ink);padding:4px 0;}
.ai-narrative b{color:#5B3FBF;}
.ai-conf{font-size:10px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed #E3DEF7;}
.ai-pick{border:1px solid var(--line);border-radius:3px;padding:12px;}
.ai-pick .k{font-size:9.5px;text-transform:uppercase;color:var(--muted);font-weight:600;letter-spacing:.03em;}
.ai-pick .v{font-size:13px;font-weight:700;margin-top:5px;}
.ai-pick .d{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;}
.topbar .right{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);}
.pbi-btn{border:1px solid var(--line);background:#fff;border-radius:2px;padding:5px 10px;font-size:11.5px;color:var(--ink);display:flex;align-items:center;gap:5px;cursor:pointer;}
.filterbar{background:#FAF9F8;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.filterbar .flabel{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-right:2px;}
.slicer{position:relative;}
.slicer-btn{background:#fff;border:1px solid var(--line);border-radius:2px;padding:6px 10px;font-size:11.5px;display:flex;align-items:center;gap:8px;cursor:pointer;min-width:110px;justify-content:space-between;}
.slicer-btn:hover{border-color:#C8C6C4;}
.slicer-btn .k{color:var(--muted);}
.slicer-btn .v{font-weight:600;color:var(--ink);}
.slicer-drop{display:none;position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:2px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:150px;z-index:30;padding:6px 0;}
.slicer.open .slicer-drop{display:block;}
.slicer-opt{padding:7px 12px;font-size:12px;display:flex;align-items:center;gap:8px;cursor:pointer;}
.slicer-opt:hover{background:#F5F5F5;}
.slicer-opt.sel{font-weight:600;color:var(--blue);}
.wrap{padding:20px 24px 60px;max-width:1560px;}
.updated{font-size:10.5px;color:var(--muted);margin-bottom:14px;}
.viz{background:#fff;border:1px solid var(--line);border-radius:3px;}
.viz-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px 7px;border-bottom:1px solid #F0EFED;flex-wrap:wrap;gap:6px;}
.viz-head .t{font-size:12.5px;font-weight:600;color:var(--ink);}
.viz-head .icons{display:flex;gap:8px;color:#A19F9D;font-size:12px;}
.viz-body{padding:12px;}
.grid{display:grid;gap:10px;}
.g-2{grid-template-columns:1fr 1fr;}
.g-6{grid-template-columns:repeat(6,1fr);}
.g-5{grid-template-columns:repeat(5,1fr);}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:700;margin:22px 0 8px;}
.card-kpi .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;font-weight:600;}
.card-kpi .val{font-family:'IBM Plex Mono';font-size:19px;font-weight:700;margin-top:6px;}
.card-kpi .delta{font-size:10px;margin-top:5px;display:flex;justify-content:space-between;color:var(--muted);}
.card-kpi .delta b{font-family:'IBM Plex Mono';}
.up{color:var(--green);} .down{color:var(--red);}
.pill{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.pill.g{background:var(--green);} .pill.a{background:var(--amber);} .pill.r{background:var(--red);}
table{width:100%;border-collapse:collapse;font-size:11.3px;}
th{text-align:left;font-size:9.5px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--line);background:#FAF9F8;}
td{padding:6.5px 8px;border-bottom:1px solid #F0EFED;}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono';}
tr:hover td{background:#FAF9F8;}
.tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:2px;text-transform:uppercase;}
.tag.g{background:var(--green-bg);color:var(--green);}
.tag.a{background:var(--amber-bg);color:var(--amber);}
.tag.r{background:var(--red-bg);color:var(--red);}
.barlist .row{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:8px;font-size:11px;padding:4px 0;}
.barbg{height:13px;background:#F0EFED;border-radius:2px;overflow:hidden;}
.barfill{height:100%;background:var(--blue);}
.barval{font-family:'IBM Plex Mono';text-align:right;}
.kpi2 .label{font-size:9.8px;text-transform:uppercase;color:var(--muted);font-weight:600;}
.kpi2 .val{font-family:'IBM Plex Mono';font-size:16px;font-weight:700;margin-top:5px;}
.kpi2 .sub{font-size:9.8px;color:var(--muted);margin-top:4px;}
.ph{font-size:8px;color:#94722F;background:#FAF0DA;padding:1px 5px;border-radius:8px;margin-left:4px;font-weight:700;}
.toggle-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.toggle-btn{border:1px solid var(--line);background:#fff;padding:5px 11px;font-size:11px;border-radius:2px;cursor:pointer;color:var(--muted);}
.toggle-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.crumbnav{font-size:11px;color:var(--muted);margin-bottom:8px;}
.crumbnav b{color:var(--blue);cursor:pointer;}
.legend-note{margin-top:26px;padding:12px 14px;background:#FAF9F8;border:1px solid var(--line);border-radius:3px;font-size:11px;color:var(--muted);line-height:1.6;}
.legend-note b{color:var(--ink);}
.ise-card{display:flex;gap:16px;align-items:flex-start;}
.ise-num{font-family:'IBM Plex Mono';font-size:34px;font-weight:700;}
.ise-status{font-size:11px;font-weight:600;margin-top:2px;}
.ise-comp{flex:1;}
.ise-comp .row{display:grid;grid-template-columns:110px 1fr 32px;align-items:center;gap:6px;font-size:10.5px;margin-bottom:5px;}
.ise-explain{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #F0EFED;font-size:11px;color:var(--muted);line-height:1.6;}
.ise-explain.open{display:block;}
.link-btn{background:none;border:none;color:var(--blue);font-size:11px;cursor:pointer;padding:0;margin-top:8px;}
.matrix-cell{padding:8px 10px;border-radius:2px;font-size:11px;font-weight:600;text-align:center;}
</style>
<link rel="stylesheet" href="/premium.css">
</head>
<body>
<div class="app">
  <div class="nav">
    <div class="nav-head">
      <span class="badge">DISEÑO PARA POWER BI · v2</span>
      <div class="title">SIDE</div>
      <div class="sub">José Ugalde Jerves</div>
    </div>
    <div class="nav-scroll" id="navScroll"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div><div class="crumb" id="crumb">SIDE / Ejecutivo</div><h1 id="pageTitle">Centro de Dirección Empresarial</h1><div class="pageQuestion" id="pageQuestion"></div></div>
      <div class="right"><span>Última actualización: hoy 07:58</span><button class="pbi-btn">↻ Actualizar</button><button class="pbi-btn">⤓ Exportar</button></div>
    </div>
    <div class="filterbar" id="filterbar"></div>
    <div class="wrap" id="content"></div>
  </div>
</div>

<script>
const USD = n => '$' + n.toLocaleString('es-EC');

const FILTER_DEFS = {
  anio:{label:'Año', options:['2026','2025','2024'], sel:'2026'},
  mes:{label:'Mes', options:['Todos','Enero','Febrero','Marzo','Abril','Mayo','Junio'], sel:'Junio'},
  canal:{label:'Canal', options:['Todos','Mayorista','Retail'], sel:'Todos'},
  unidad:{label:'Unidad de Negocio', options:['Todas','Mayorista Hogar','Mayorista Intorno','Retail JUJ','Retail Intorno'], sel:'Todas'},
  provincia:{label:'Provincia', options:['Todas','Azuay','Cañar','Loja','El Oro'], sel:'Todas'},
  canton:{label:'Cantón', options:['Todos','Cuenca','Gualaceo','Girón'], sel:'Todos'},
  zona:{label:'Zona', options:['Todas','Zona 1','Zona 2','Zona 3'], sel:'Todas'},
  vendedor:{label:'Vendedor', options:['Todos','Juan Pérez','Carlos López','María Santos'], sel:'Todos'},
  marca:{label:'Marca', options:['Todas','UMCO','Warenhaus','Chaide','Mesas y Sillas JUJ'], sel:'Todas'},
  categoria:{label:'Categoría', options:['Todas','Ollas','Sartenes','Electrodomésticos menores'], sel:'Todas'},
  subcategoria:{label:'Subcategoría', options:['Todas','Línea Nara','Línea Meridiano','Línea Brilliance'], sel:'Todas'},
  proveedor:{label:'Proveedor', options:['Todos','UMCO','Chaide','Warenhaus','Corpmunab'], sel:'Todos'},
  bodega:{label:'Bodega', options:['Todas','Bodega Central','Punto Ordoñez Lazo'], sel:'Todas'},
  estadopedido:{label:'Estado del pedido', options:['Todos','Pendiente','Retrasado','Completado'], sel:'Todos'},
  transportista:{label:'Transportista', options:['Todos','Propio','Tercerizado'], sel:'Todos'},
  campana:{label:'Campaña', options:['Todas','Verano 2026','Día de la Madre'], sel:'Todas'},
  segmento:{label:'Segmento', options:['Todos','Mayorista','Minorista','Cliente Final'], sel:'Todos'},
  estadosku:{label:'Estado SKU', options:['Todos','Activo','Sin movimiento','Descontinuado'], sel:'Todos'},
  ciudad:{label:'Ciudad', options:['Todas','Cuenca','Machala','Loja'], sel:'Todas'},
  empresa:{label:'Empresa', options:['José Ugalde Jerves Cía. Ltda.'], sel:'José Ugalde Jerves Cía. Ltda.'},
  trimestre:{label:'Sesión Directorio', options:['Q2 2026','Q1 2026'], sel:'Q2 2026'},
  semestre:{label:'Semestre', options:['S1 2026','S2 2025'], sel:'S1 2026'},
  area:{label:'Área', options:['Todas','Comercial','Logística','Administración'], sel:'Todas'},
  puntoventa:{label:'Punto de venta', options:['Todos','Local Centro','Local Norte'], sel:'Todos'},
};

const STANDARD_FILTERS = ['anio','mes','canal','unidad','marca','categoria','subcategoria','vendedor','proveedor','provincia','ciudad','zona'];

const PAGES = [
  {id:'nivel1', group:'Ejecutivo', label:'Dirección Empresarial', dot:'g', filters:['anio','mes','canal','unidad']},
  {id:'comercial', group:'Centros de Inteligencia', label:'Comercial', dot:'g', filters:STANDARD_FILTERS},
  {id:'financiero', group:'Centros de Inteligencia', label:'Financiero', dot:'g', filters:STANDARD_FILTERS},
  {id:'compras', group:'Centros de Inteligencia', label:'Compras', dot:'a', filters:STANDARD_FILTERS},
  {id:'inventarios', group:'Centros de Inteligencia', label:'Inventarios', dot:'a', filters:STANDARD_FILTERS},
  {id:'clientes', group:'Centros de Inteligencia', label:'Clientes', dot:'a', filters:STANDARD_FILTERS},
  {id:'logistica', group:'Centros de Inteligencia', label:'Logística', dot:'a', filters:STANDARD_FILTERS},
  {id:'marketing', group:'Centros de Inteligencia', label:'Marketing', dot:'a', filters:STANDARD_FILTERS},
  {id:'riesgos', group:'Centros de Inteligencia', label:'Riesgos', dot:'r', filters:STANDARD_FILTERS, paused:true},
  {id:'mayoristahogar', group:'Unidades de Negocio', label:'Mayorista Hogar', dot:'g', filters:STANDARD_FILTERS},
  {id:'mayoristaintorno', group:'Unidades de Negocio', label:'Mayorista Intorno', dot:'a', filters:STANDARD_FILTERS},
  {id:'retailjuj', group:'Unidades de Negocio', label:'Retail JUJ', dot:'g', filters:STANDARD_FILTERS},
  {id:'retailintorno', group:'Unidades de Negocio', label:'Retail Intorno', dot:'r', filters:STANDARD_FILTERS},
];

const QUESTIONS = {
  nivel1: '¿Cómo está la empresa?',
  comercial: '¿Cómo estamos vendiendo?',
  financiero: '¿La empresa está generando valor?',
  compras: '¿Estamos abasteciendo correctamente?',
  inventarios: '¿Cómo está invertido nuestro capital?',
  clientes: '¿Cómo está evolucionando nuestra cartera?',
  logistica: '¿Estamos entregando correctamente?',
  marketing: '¿Las campañas generan crecimiento?',
  riesgos: '¿Qué riesgos enfrenta la empresa? — en pausa hasta completar el análisis',
  mayoristahogar: '¿Cómo está funcionando Mayorista Hogar?',
  mayoristaintorno: '¿Cómo está funcionando Mayorista Intorno?',
  retailjuj: '¿Cómo está funcionando Retail JUJ?',
  retailintorno: '¿Cómo está funcionando Retail Intorno?',
};

const navScroll = document.getElementById('navScroll');
let lastGroup = null;
PAGES.forEach(pg=>{
  if(pg.group !== lastGroup){ const g=document.createElement('div'); g.className='nav-group'; g.textContent=pg.group; navScroll.appendChild(g); lastGroup=pg.group; }
  const it = document.createElement('div');
  it.className='nav-item'+(pg.id==='nivel1'?' active':'')+(pg.paused?' paused':'');
  it.dataset.id = pg.id;
  it.innerHTML = `<span class="dot pill ${pg.dot}"></span><span>${pg.label}</span>${pg.paused?'<span class="pausetag">en pausa</span>':''}`;
  it.onclick = ()=>selectPage(pg.id);
  navScroll.appendChild(it);
});

function selectPage(id){
  const pg = PAGES.find(p=>p.id===id);
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.id===id));
  document.getElementById('pageTitle').textContent = pg.label;
  document.getElementById('crumb').textContent = 'SIDE / ' + pg.group;
  document.getElementById('pageQuestion').textContent = QUESTIONS[id] || '';
  renderFilterbar(pg.filters);
  if(pg.paused && pg.id !== 'riesgos'){
    document.getElementById('content').innerHTML = `<div class="pause-box">
      <div style="font-size:14px;font-weight:600;color:var(--ink);margin-bottom:8px;">⏸ Centro en pausa</div>
      Este Centro de Inteligencia queda en pausa hasta completar su análisis y definición funcional detallada,<br>
      siguiendo el mismo estándar aplicado a Comercial, Financiero, Compras, Inventarios, Clientes, Logística y Marketing.
    </div>`;
  } else {
    renderPage(id);
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderFilterbar(keys){
  const fb = document.getElementById('filterbar');
  fb.innerHTML = `<span class="flabel">Filtros</span>` + keys.map(k=>{
    const f = FILTER_DEFS[k];
    return `<div class="slicer" data-key="${k}">
      <div class="slicer-btn" onclick="toggleSlicer(this)"><span><span class="k">${f.label}:</span> <span class="v">${f.sel}</span></span><span style="color:var(--muted);font-size:9px;">▾</span></div>
      <div class="slicer-drop">${f.options.map(o=>`<div class="slicer-opt ${o===f.sel?'sel':''}" onclick="pickOption(event,'${k}','${o}')"><input type="checkbox" ${o===f.sel?'checked':''}/> ${o}</div>`).join('')}</div>
    </div>`;
  }).join('');
}
function toggleSlicer(btn){
  const s = btn.parentElement; const wasOpen = s.classList.contains('open');
  document.querySelectorAll('.slicer.open').forEach(x=>x.classList.remove('open'));
  if(!wasOpen) s.classList.add('open');
}
function pickOption(ev, key, val){
  ev.stopPropagation(); FILTER_DEFS[key].sel = val;
  const pg = PAGES.find(p=>p.id===document.querySelector('.nav-item.active').dataset.id);
  renderFilterbar(pg.filters);
}
document.addEventListener('click', (e)=>{ if(!e.target.closest('.slicer')) document.querySelectorAll('.slicer.open').forEach(x=>x.classList.remove('open')); });

/* ======= helpers ======= */
function viz(title, bodyHtml, opts){ opts=opts||{};
  return `<div class="viz" style="${opts.span?`grid-column:span ${opts.span};`:''}">
    <div class="viz-head"><span class="t">${title}</span><span class="icons">⛶ ⋯</span></div>
    <div class="viz-body">${bodyHtml}</div></div>`;
}
function kpiCard(label, val, deltas, sem){
  return `<div class="viz"><div class="viz-body card-kpi">
    <div style="display:flex;justify-content:space-between;"><span class="label">${label}</span><span class="pill ${sem}"></span></div>
    <div class="val">${val}</div>
    ${deltas.map(d=>`<div class="delta"><span>${d[0]}</span><b class="${d[2]||''}">${d[1]}</b></div>`).join('')}
  </div></div>`;
}
function kpi2(label, val, sub){ return `<div class="viz"><div class="viz-body kpi2"><div class="label">${label}</div><div class="val">${val}</div><div class="sub">${sub}</div></div></div>`; }
function barListViz(title, rows, maxOverride){
  const max = maxOverride || Math.max(...rows.map(r=>r.v));
  return viz(title, `<div class="barlist">${rows.map(r=>`<div class="row"><span>${r.n}</span><div class="barbg"><div class="barfill" style="width:${(r.v/max*100).toFixed(0)}%;${r.color?`background:${r.color}`:''}"></div></div><span class="barval">${r.vt}</span></div>`).join('')}</div>`);
}
function tableViz(title, headers, rows, opts){
  return viz(title, `<table><tr>${headers.map(h=>`<th class="${h.num?'num':''}">${h.t}</th>`).join('')}</tr>
    ${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${headers[i].num?'num':''}">${c}</td>`).join('')}</tr>`).join('')}</table>`, opts);
}
function listBlock(title, items){
  return viz(title, items.map(it=>`<div style="padding:7px 0;border-bottom:1px solid #F0EFED;display:flex;gap:8px;">
    <div style="width:3px;background:${it.c};border-radius:2px;flex-shrink:0;"></div>
    <div><div style="font-size:11.5px;font-weight:600;">${it.t}</div><div style="font-size:10px;color:var(--muted);margin-top:2px;">${it.d}</div></div></div>`).join(''));
}
function iseCard(id, score, status, statusColor, comps, formula){
  return `<div class="viz"><div class="viz-body">
    <div class="ise-card">
      <div><div class="ise-num" style="color:${statusColor}">${score}</div><div style="font-size:9px;color:var(--muted);">/100</div><div class="ise-status" style="color:${statusColor}">${status}</div></div>
      <div class="ise-comp">${comps.map(c=>`<div class="row"><span>${c[0]} (${c[1]}%)</span><div class="barbg"><div class="barfill" style="background:${statusColor}" ></div></div><span></span></div>`).join('')}
        <button class="link-btn" onclick="document.getElementById('${id}').classList.toggle('open')">¿Cómo se calcula? ▾</button>
        <div class="ise-explain" id="${id}">${formula}</div>
      </div>

let toggleState = {};
function toggleViz(vizId, title, options, defaultOpt, dataByOpt){
  toggleState[vizId] = toggleState[vizId] || defaultOpt;
  return viz(title, `
    <div class="toggle-row" id="tr-${vizId}">
      ${options.map(o=>`<button class="toggle-btn ${o===toggleState[vizId]?'active':''}" onclick="setToggle('${vizId}','${o}')">${o}</button>`).join('')}
    </div>
    <div id="tb-${vizId}">${renderToggleBody(dataByOpt[toggleState[vizId]])}</div>
  `);
}
function renderToggleBody(rows){
  const max = Math.max(...rows.map(r=>r.v));
  return `<div class="barlist">${rows.map(r=>`<div class="row"><span>${r.n}</span><div class="barbg"><div class="barfill" style="width:${(r.v/max*100).toFixed(0)}%"></div></div><span class="barval">${r.vt}</span></div>`).join('')}</div>`;
}
window.setToggle = function(vizId, opt){ toggleState[vizId] = opt; renderPage(document.querySelector('.nav-item.active').dataset.id); };

function semaphoreMatrix(rows){
  const colors = {g:['var(--green-bg)','var(--green)'], a:['var(--amber-bg)','var(--amber)'], r:['var(--red-bg)','var(--red)']};
  return viz('Matriz Comercial — mejor resultado / mayor riesgo', `<table>
    <tr><th>Dimensión</th><th>Mejor resultado</th><th>Mayor riesgo</th></tr>
    ${rows.map(r=>`<tr><td><b>${r[0]}</b></td>
      <td><span class="matrix-cell" style="background:${colors.g[0]};color:${colors.g[1]}">${r[1]}</span></td>
      <td><span class="matrix-cell" style="background:${colors.r[0]};color:${colors.r[1]}">${r[2]}</span></td></tr>`).join('')}
  </table>`);
}
function geoNav(id){
  return viz('Cobertura Comercial — Provincia → Cantón → Zona', `
    <div class="crumbnav" id="crumb-${id}"><b onclick="geoReset('${id}')">Todas las provincias</b></div>
    <div id="geobody-${id}">${geoTable([
      {n:'Azuay', v:44, clientes:612, ticket:'$44.10', rent:'12.8%'},
      {n:'Cañar', v:22, clientes:301, ticket:'$38.20', rent:'10.1%'},
      {n:'Loja', v:19, clientes:264, ticket:'$35.90', rent:'6.4%'},
      {n:'El Oro', v:15, clientes:198, ticket:'$41.00', rent:'11.2%'},
    ], id, 'provincia')}</div>
  `);
}
function geoTable(rows, id, level){
  return `<table><tr><th>${level==='provincia'?'Provincia':level==='canton'?'Cantón':'Zona'}</th><th class="num">Ventas %</th><th class="num">Clientes Fact.</th><th class="num">Ticket Prom.</th><th class="num">Rentabilidad</th></tr>
    ${rows.map(r=>`<tr style="cursor:pointer;" onclick="geoDrill('${id}','${level}','${r.n}')"><td><b style="color:var(--blue)">${r.n} ›</b></td><td class="num">${r.v}%</td><td class="num">${r.clientes}</td><td class="num">${r.ticket}</td><td class="num">${r.rent}</td></tr>`).join('')}
  </table>`;
}
window.geoDrill = function(id, level, name){
  const next = level==='provincia' ? [
    {n:'Cuenca', v:70, clientes:420, ticket:'$45.00', rent:'13.1%'},
    {n:'Gualaceo', v:18, clientes:110, ticket:'$40.50', rent:'11.0%'},
    {n:'Girón', v:12, clientes:82, ticket:'$37.80', rent:'9.4%'},
  ] : [
    {n:'Zona 1', v:52, clientes:210, ticket:'$46.20', rent:'13.5%'},
    {n:'Zona 2', v:48, clientes:210, ticket:'$43.90', rent:'12.6%'},
  ];
  const nextLevel = level==='provincia' ? 'canton' : 'zona';
  document.getElementById('geobody-'+id).innerHTML = geoTable(next, id, nextLevel);
  document.getElementById('crumb-'+id).innerHTML = `<b onclick="geoReset('${id}')">Todas las provincias</b> › ${name}`;
};
window.geoReset = function(id){
  document.getElementById('crumb-'+id).innerHTML = `<b onclick="geoReset('${id}')">Todas las provincias</b>`;
  document.getElementById('geobody-'+id).innerHTML = geoTable([
    {n:'Azuay', v:44, clientes:612, ticket:'$44.10', rent:'12.8%'}, {n:'Cañar', v:22, clientes:301, ticket:'$38.20', rent:'10.1%'},
    {n:'Loja', v:19, clientes:264, ticket:'$35.90', rent:'6.4%'}, {n:'El Oro', v:15, clientes:198, ticket:'$41.00', rent:'11.2%'},
  ], id, 'provincia');
};
